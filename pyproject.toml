[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocoder-ai"
version = "1.0.0"
description = "Autonomous Multi-Platform Coding Agent for LeetCode, Codeforces, HackerRank, CodeChef, and HackerEarth"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vinay", email = "vinay@users.noreply.github.com"}
]
keywords = [
    "competitive-programming",
    "leetcode",
    "codeforces",
    "hackerrank",
    "codechef",
    "hackerearth",
    "automation",
    "ai-agent",
    "playwright",
    "gemini"
]
dependencies = [
    "google-genai>=2.34.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pyperclip>=1.8.0",
    "psycopg2-binary>=2.9.9",
    "google-cloud-secret-manager>=2.16.0",
]

[project.scripts]
autocoder = "bot:cli"

[project.urls]
Homepage = "https://github.com/Vinay-711/autonomous-coding-bot"
Repository = "https://github.com/Vinay-711/autonomous-coding-bot.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["repos", "solutions", ".venv", "saved_chrome_login"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module level import not at top of file
    "E722",  # bare except (in legacy browser exception handlers)
    "E741",  # ambiguous variable name
    "E712",  # equality comparison to True/False (explicitly tested for dataclass __eq__ compatibility)
    "W293",  # blank line contains whitespace
]



